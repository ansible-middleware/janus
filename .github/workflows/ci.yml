---
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [labeled]

env:
  COLORTERM: 'yes'
  TERM: 'xterm-256color'
  PYTEST_ADDOPTS: '--color=yes'

jobs:
  CI:
    # Run on: push, pull_request, OR pull_request_target with 'safe-to-test' label
    if: |
      github.event_name != 'pull_request_target' ||
      github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.11"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: ansible_collections/middleware_automation/janus
          # For forked PRs with 'safe-to-test' label, checkout the fork's code
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          # requirements.txt lives under the collection checkout path, not repo root
          cache-dependency-path: ansible_collections/middleware_automation/janus/requirements.txt

      - name: Install yamllint, ansible and molecule
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core flake8 ansible-lint voluptuous
          if [ -f ansible_collections/middleware_automation/janus/requirements.txt ]; then
            pip install -r ansible_collections/middleware_automation/janus/requirements.txt
          fi

      - name: Create default collection path
        run: |
          mkdir -p /home/runner/.ansible/
          ln -s /home/runner/work/janus/janus /home/runner/.ansible/collections

      - name: Run linter
        run: |
          ansible-lint --version
          ansible-lint -v
        working-directory: ./ansible_collections/middleware_automation/janus
